<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | ILECO-1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 45%,#334155 100%);
    color:#fff;
}

/* Background Glow */
body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    top:-250px;
    right:-200px;
    background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%);
}

body::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    bottom:-220px;
    left:-180px;
    background:radial-gradient(circle,rgba(16,185,129,.15),transparent 70%);
}

/* Grid Background */
.grid{
    position:absolute;
    width:100%;
    height:100%;
    background-image:
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:60px 60px;
}

/* Animated Lines */
.line{
    position:absolute;
    width:100%;
    height:2px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
}

.line::after{
    content:"";
    position:absolute;
    width:120px;
    height:100%;
    background:linear-gradient(90deg,transparent,#38bdf8,transparent);
    animation:flow 4s linear infinite;
}

.line:nth-child(2){top:25%;}
.line:nth-child(3){top:50%;}
.line:nth-child(4){top:75%;}

@keyframes flow{
    from{
        transform:translateX(-120px);
    }
    to{
        transform:translateX(100vw);
    }
}

/* Main Card */
.card{
    position:relative;
    z-index:2;
    width:520px;
    max-width:90%;
    text-align:center;
    padding:55px 45px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Badge */
.badge{
    display:inline-block;
    padding:7px 18px;
    border-radius:999px;
    border:1px solid rgba(16,185,129,.45);
    background:rgba(16,185,129,.12);
    color:#86efac;
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
    margin-bottom:28px;
}

/* Icon */
.icon{
    font-size:60px;
    margin-bottom:15px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        opacity:.8;
    }
}

/* 404 */
h1{
    font-size:120px;
    line-height:1;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:8px;
    text-shadow:
        0 0 12px rgba(56,189,248,.4),
        0 0 30px rgba(56,189,248,.2);
}

h2{
    font-size:28px;
    font-weight:700;
    margin-bottom:18px;
}

p{
    color:#cbd5e1;
    line-height:1.8;
    font-size:15px;
}

/* Loading Bar */
.loading{
    margin:35px auto 20px;
    width:180px;
    height:5px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
}

.loading span{
    display:block;
    width:40%;
    height:100%;
    background:#38bdf8;
    animation:loading 1.4s infinite;
}

@keyframes loading{
    from{
        transform:translateX(-100%);
    }
    to{
        transform:translateX(350%);
    }
}

/* Countdown */
.countdown{
    margin-top:12px;
    color:#94a3b8;
    font-size:14px;
}

.countdown span{
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

/* Footer */
.footer{
    margin-top:30px;
    font-size:12px;
    color:rgba(255,255,255,.45);
}
</style>

</head>

<body>

<div class="grid"></div>

<div class="line"></div>
<div class="line"></div>
<div class="line"></div>

<div class="card">

    <div class="badge">
        SYSTEM STATUS
    </div>

    <div class="icon">
        ⚡
    </div>

    <h1>404</h1>

    <h2>Page Not Available</h2>

    <p>
        The page you requested could not be found.
    </p>

    <p>
        It may have been moved, deleted, or the link you followed is no longer available.
    </p>

    <div class="loading">
        <span></span>
    </div>

    <div class="countdown">
        Redirecting to the dashboard in
        <span id="timer">5</span>
        seconds...
    </div>

    <div class="footer">
        ILECO-1 Customer Care Communication Center
    </div>

</div>

<script>
let seconds = 5;

const timer = document.getElementById("timer");

const countdown = setInterval(function(){

    seconds--;

    timer.textContent = seconds;

    if(seconds <= 0){

        clearInterval(countdown);

        // Change this if your dashboard route is different
        window.location.href = "/dashboard";

    }

},1000);
</script>

</body>
</html>
